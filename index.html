      INFP: { G: true, A: true, P: true, S: true },
      INFJ: { G: true, A: true, P: true, D: true },
      INTP: { G: true, A: true, F: true, S: true },
      INTJ: { G: true, A: true, F: true, D: true },
      ISFP: { G: true, R: true, P: true, S: true },
      ISFJ: { G: true, R: true, P: true, D: true },
      ISTP: { G: true, R: true, F: true, S: true },
      ISTJ: { G: true, R: true, F: true, D: true }
    };

    function OnlinePersonaTest() {
      const [stage, setStage] = useState('intro');
      const [currentQ, setCurrentQ] = useState(0);
      const [answers, setAnswers] = useState({});
      const [mbti, setMbti] = useState('');
      const [result, setResult] = useState(null);
      const [selectedOption, setSelectedOption] = useState(null);

      const calculateResult = (finalAnswers) => {
        const scores = { L: 0, G: 0, R: 0, A: 0, F: 0, P: 0, D: 0, S: 0 };
        
        Object.values(finalAnswers).forEach(answer => {
          Object.entries(answer).forEach(([key, value]) => {
            scores[key] += value;
          });
        });

        const code = 
          (scores.L >= scores.G ? 'L' : 'G') +
          (scores.R >= scores.A ? 'R' : 'A') +
          (scores.F >= scores.P ? 'F' : 'P') +
          (scores.D >= scores.S ? 'D' : 'S');

        return { code, scores };
      };

      const handleAnswer = (score) => {
        setSelectedOption(score);
        
        setTimeout(() => {
          const newAnswers = { ...answers, [currentQ]: score };
          setAnswers(newAnswers);
          setSelectedOption(null);

          if (currentQ < questions.length - 1) {
            setCurrentQ(currentQ + 1);
          } else {
            const { code, scores } = calculateResult(newAnswers);
            setResult({ code, scores, persona: personaData[code] });
            setStage('result');
          }
        }, 300);
      };

      const getGapAnalysis = () => {
        if (!mbti || !result) return null;
        const mbtiUpper = mbti.toUpperCase();
        const expected = mbtiMapping[mbtiUpper];
        if (!expected) return null;

        let gapCount = 0;
        const axes = [
          { expected: expected.L ? 'L' : 'G', actual: result.code[0] },
          { expected: expected.R ? 'R' : 'A', actual: result.code[1] },
          { expected: expected.F ? 'F' : 'P', actual: result.code[2] },
          { expected: expected.D ? 'D' : 'S', actual: result.code[3] }
        ];

        axes.forEach(axis => {
          if (axis.expected !== axis.actual) gapCount++;
        });

        const gapScore = Math.round((gapCount / 4) * 100);

        let message = "";
        if (gapScore === 0) {
          message = "온·오프라인 완벽 일치! 진정성 있는 타입이네요.";
        } else if (gapScore === 25) {
          message = "살짝 다른 면이 있지만 대체로 일관된 편이에요.";
        } else if (gapScore === 50) {
          message = "온라인에서 꽤 다른 모습을 보여주고 있네요.";
        } else if (gapScore === 75) {
          message = "현실과 온라인이 거의 반대! 이중생활 의심됩니다.";
        } else {
          message = "완전히 다른 사람이 되네요. 디지털 변신 만렙!";
        }

        return { score: gapScore, message, gapCount };
      };

      const restart = () => {
        setStage('intro');
        setCurrentQ(0);
        setAnswers({});
        setMbti('');
        setResult(null);
      };

      const shareResult = () => {
        const bestMatchPersona = personaData[result.persona.bestMatch];
        const worstMatchPersona = personaData[result.persona.worstMatch];
        
        const text = `나의 온라인 페르소나: ${result.persona.emoji} ${result.code} - ${result.persona.name}

"${result.persona.roast}"

${result.persona.desc}

💚 찰떡궁합: ${bestMatchPersona?.emoji} ${result.persona.bestMatch} ${bestMatchPersona?.name}
💔 상극: ${worstMatchPersona?.emoji} ${result.persona.worstMatch} ${worstMatchPersona?.name}

전체의 ${result.persona.percentage}%만 이 유형!

테스트 해보기 👉 https://sunworl.github.io/my-online-persona-test/`;
        
        navigator.clipboard.writeText(text).then(() => {
          alert('결과가 클립보드에 복사되었습니다! 친구에게 붙여넣기 하세요 💬');
        }).catch(() => {
          prompt('아래 텍스트를 복사하세요:', text);
        });
      };

      const siteUrl = 'https://sunworl.github.io/my-online-persona-test/';

      return (
        <div style={{
          minHeight: '100vh',
          background: 'linear-gradient(135deg, #0F0F1A 0%, #1A1A2E 50%, #16213E 100%)',
          color: '#EAEAEA',
          overflow: 'hidden'
        }}>
          <div style={{
            position: 'fixed',
            top: 0,
            left: 0,
            right: 0,
            bottom: 0,
            overflow: 'hidden',
            pointerEvents: 'none',
            zIndex: 0
          }}>
            <div style={{
              position: 'absolute',
              top: '10%',
              left: '5%',
              width: '300px',
              height: '300px',
              background: 'radial-gradient(circle, rgba(147,51,234,0.15) 0%, transparent 70%)',
              borderRadius: '50%',
              filter: 'blur(40px)'
            }} />
            <div style={{
              position: 'absolute',
              bottom: '20%',
              right: '10%',
              width: '400px',
              height: '400px',
              background: 'radial-gradient(circle, rgba(59,130,246,0.1) 0%, transparent 70%)',
              borderRadius: '50%',
              filter: 'blur(60px)'
            }} />
          </div>

          <div style={{
            position: 'relative',
            zIndex: 1,
            maxWidth: '500px',
            margin: '0 auto',
            padding: '20px',
            minHeight: '100vh',
            display: 'flex',
            flexDirection: 'column'
          }}>
            
            {stage === 'intro' && (
              <div style={{
                flex: 1,
                display: 'flex',
                flexDirection: 'column',
                justifyContent: 'center',
                alignItems: 'center',
                textAlign: 'center',
                animation: 'fadeIn 0.6s ease-out'
              }}>
                <div style={{ fontSize: '80px', marginBottom: '20px' }}>👻</div>
                <h1 style={{
                  fontSize: '32px',
                  fontWeight: '800',
                  marginBottom: '12px',
                  background: 'linear-gradient(135deg, #A78BFA, #60A5FA)',
                  WebkitBackgroundClip: 'text',
                  WebkitTextFillColor: 'transparent',
                  letterSpacing: '-1px'
                }}>
                  온라인 페르소나
                </h1>
                <p style={{
                  fontSize: '18px',
                  color: '#9CA3AF',
                  marginBottom: '40px',
                  lineHeight: 1.6
                }}>
                  현실의 나와 온라인의 나,<br/>얼마나 다를까?
                </p>

                <div style={{
                  width: '100%',
                  marginBottom: '24px'
                }}>
                  <label style={{
                    display: 'block',
                    fontSize: '14px',

                    marginBottom: '8px',
                    textAlign: 'left'
                  }}>
                    MBTI 입력 (선택사항)

                  <input

                    style={{
                      width: '100%',
                      padding: '16px 20px',
                      fontSize: '18px',
                      fontWeight: '600',

              </div>

            {stage === 'result' && result && (
              <div style={{
                flex: 1,
                display: 'flex',
                flexDirection: 'column',

                animation: 'fadeIn 0.6s ease-out'

                  background: `linear-gradient(135deg, ${result.persona.color}22, ${result.persona.color}11)`,

                  padding: '32px 24px',
                  textAlign: 'center',
                  marginBottom: '16px'
                }}>
                  <div style={{ fontSize: '64px', marginBottom: '16px' }}>{result.persona.emoji}</div>
                  <div style={{
                    fontSize: '16px',
                    fontWeight: '600',
                    color: result.persona.color,
                    marginBottom: '8px',
                    letterSpacing: '3px'
                  }}>
                    {result.code}
                  </div>
                  <h2 style={{
                    fontSize: '28px',
                    fontWeight: '800',
                    color: '#F3F4F6',
                    marginBottom: '12px'
                  }}>
                    {result.persona.name}
                  </h2>
                  <p style={{
                    fontSize: '16px',
                    color: '#9CA3AF',
                    lineHeight: 1.6,
                    marginBottom: '16px'
                  }}>
                    {result.persona.desc}
                  </p>
                  
                  {/* 통계 */}
                  <div style={{
                    display: 'inline-block',
                    background: 'rgba(255,255,255,0.1)',
                    padding: '8px 16px',
                    borderRadius: '20px',
                    fontSize: '13px',
                    color: '#D1D5DB'
                  }}>
                    🌍 전체의 <span style={{ fontWeight: '700', color: '#A78BFA' }}>{result.persona.percentage}%</span>만 이 유형
                  </div>
                </div>

                {/* 직설 코멘트 */}
                <div style={{
                  background: 'rgba(239,68,68,0.1)',
                  border: '1px solid rgba(239,68,68,0.2)',
                  borderRadius: '16px',
                  padding: '16px 20px',
                  marginBottom: '16px',
                  textAlign: 'center'
                }}>
                  <div style={{ fontSize: '12px', color: '#F87171', marginBottom: '6px', fontWeight: '600' }}>
                    🔥 팩트 폭격
                  </div>
                  <p style={{
                    fontSize: '15px',
                    color: '#FCA5A5',
                    fontStyle: 'italic',
                    lineHeight: 1.5
                  }}>
                    "{result.persona.roast}"
                  </p>
                </div>

                {/* 궁합 섹션 */}
                <div style={{
                  display: 'flex',
                  gap: '12px',
                  marginBottom: '16px'
                }}>
                  {/* 찰떡궁합 */}
                  <div style={{
                    flex: 1,
                    background: 'rgba(16,185,129,0.1)',
                    border: '1px solid rgba(16,185,129,0.2)',
                    borderRadius: '16px',
                    padding: '16px',
                    textAlign: 'center'
                  }}>
                    <div style={{ fontSize: '11px', color: '#10B981', marginBottom: '8px', fontWeight: '600' }}>
                      💚 찰떡궁합
                    </div>
                    <div style={{ fontSize: '24px', marginBottom: '4px' }}>
                      {personaData[result.persona.bestMatch]?.emoji}
                    </div>
                    <div style={{ fontSize: '13px', fontWeight: '700', color: '#D1FAE5', marginBottom: '4px' }}>
                      {result.persona.bestMatch}
                    </div>
                    <div style={{ fontSize: '11px', color: '#6EE7B7', marginBottom: '6px' }}>
                      {personaData[result.persona.bestMatch]?.name}
                    </div>
                    <p style={{ fontSize: '11px', color: '#A7F3D0', lineHeight: 1.4 }}>
                      {result.persona.bestMatchReason}
                    </p>
                  </div>

                  {/* 상극 */}
                  <div style={{
                    flex: 1,
                    background: 'rgba(239,68,68,0.1)',
                    border: '1px solid rgba(239,68,68,0.2)',
                    borderRadius: '16px',
                    padding: '16px',
                    textAlign: 'center'
                  }}>
                    <div style={{ fontSize: '11px', color: '#EF4444', marginBottom: '8px', fontWeight: '600' }}>
                      💔 상극
                    </div>
                    <div style={{ fontSize: '24px', marginBottom: '4px' }}>
                      {personaData[result.persona.worstMatch]?.emoji}
                    </div>
                    <div style={{ fontSize: '13px', fontWeight: '700', color: '#FECACA', marginBottom: '4px' }}>
                      {result.persona.worstMatch}
                    </div>
                    <div style={{ fontSize: '11px', color: '#FCA5A5', marginBottom: '6px' }}>
                      {personaData[result.persona.worstMatch]?.name}
                    </div>
                    <p style={{ fontSize: '11px', color: '#FECACA', lineHeight: 1.4 }}>
                      {result.persona.worstMatchReason}
                    </p>
                  </div>
                </div>

                {/* MBTI 갭 분석 */}
                {mbti && mbti.length === 4 && (() => {
                  const gap = getGapAnalysis();
                  if (!gap) return null;
                  return (
                    <div style={{
                      background: 'rgba(255,255,255,0.05)',
                      border: '2px solid rgba(255,255,255,0.1)',
                      borderRadius: '20px',
                      padding: '24px',
                      marginBottom: '16px'
                    }}>
                      <div style={{
                        display: 'flex',
                        justifyContent: 'space-between',
                        alignItems: 'center',
                        marginBottom: '16px'
                      }}>
                        <span style={{ fontSize: '14px', color: '#9CA3AF' }}>오프라인 vs 온라인 갭</span>
                        <span style={{
                          fontSize: '24px',
                          fontWeight: '800',
                          color: gap.score >= 50 ? '#F59E0B' : '#10B981'
                        }}>
                          {gap.score}%
                        </span>
                      </div>
                      <div style={{
                        height: '8px',
                        background: 'rgba(255,255,255,0.1)',
                        borderRadius: '4px',
                        overflow: 'hidden',
                        marginBottom: '16px'
                      }}>
                        <div style={{
                          height: '100%',
                          width: `${Math.max(gap.score, 5)}%`,
                          background: gap.score >= 50 
                            ? 'linear-gradient(90deg, #F59E0B, #EF4444)' 
                            : 'linear-gradient(90deg, #10B981, #3B82F6)',
                          borderRadius: '4px',
                          transition: 'width 0.5s ease'
                        }} />
                      </div>
                      <div style={{
                        display: 'flex',

                        fontSize: '13px',

                      }}>
                        <span>🧑 오프라인: {mbti}</span>
                        <span>💻 온라인: {result.code}</span>
                      </div>
                      <p style={{
                        fontSize: '14px',
                        color: '#D1D5DB',
                        textAlign: 'center',
                        fontStyle: 'italic'
                      }}>
                        "{gap.message}"
                      </p>
                      <div style={{
                        marginTop: '12px',
                        fontSize: '11px',
                        color: '#6B7280',
                        textAlign: 'center'
                      }}>

                      </div>
                    </div>

                })()}

                {/* 상세 분석 */}
                <div style={{
                  background: 'rgba(255,255,255,0.03)',
                  border: '1px solid rgba(255,255,255,0.08)',

                  marginBottom: '24px'
                }}>
                  <div style={{

                  }}>

                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                    {[
                      { label: '존재감', left: 'L (Loud)', right: 'G (Ghost)', lScore: result.scores.L, rScore: result.scores.G },

                    ].map((axis, idx) => (
                      <div key={idx}>
                        <div style={{
                          display: 'flex',
                          justifyContent: 'space-between',
                          fontSize: '11px',

                        }}>

                          <div style={{
